name: Build Palia Browser APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle*'
      - 'settings.gradle*'
      - 'gradle.properties'
      - '.github/workflows/build-palia-browser-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build APK from latest source
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Upload fresh APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: palia-browser-debug-apk-latest
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
